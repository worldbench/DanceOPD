# Paper-style DanceOPD config: SD3.5 edit-fusion setting.
# Fill all null / placeholder paths before training. No seed is set.

backend: sd35

model:
  pretrained_model: null  # e.g. stabilityai/stable-diffusion-3.5-medium or local path

student:
  init: base
  lora_rank: 128
  lora_alpha: 128
  lora_target_modules: null

teachers:
  - name: local_edit
    base_ckpt: null  # optional full/merged transformer checkpoint
    lora_dir: null   # optional PEFT LoRA directory
    weight: 1.0
  - name: global_edit
    base_ckpt: null  # optional full/merged transformer checkpoint
    lora_dir: null   # optional PEFT LoRA directory
    weight: 1.0
  - name: t2i
    base_ckpt: null  # base route when both fields are null
    lora_dir: null
    weight: 1.0

routing:
  routes:
    - teacher: local_edit
      weight: 1.0
    - teacher: global_edit
      weight: 1.0
    - teacher: t2i
      weight: 1.0

data:
  prompts_csv: null
  prompt_column: prompt
  caption_dict_column: caption_dict
  caption_dict_keys: [prompt, caption, instruction]

training:
  method: danceopd
  output_dir: null
  resolution: 1024
  rollout_steps: 16
  k: 1
  query_bias: low_t
  lr: 2.0e-4
  weight_decay: 0.0
  grad_accum: 4
  max_train_steps: 3000
  save_steps: 300
  mixed_precision: bf16
  gradient_clip: 1.0
  max_sequence_length: 256
  log_every: 20
