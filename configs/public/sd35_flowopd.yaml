# Directly runnable SD3.5-M Flow-OPD compatibility recipe using the public
# OCR and GenEval expert LoRAs from the official Flow-OPD release.
# Duration is reduced to one optimizer step; the algorithmic group/trajectory
# settings remain at their reproduction values and can therefore be expensive.
backend: sd35
model:
  pretrained_model: stabilityai/stable-diffusion-3.5-medium
student:
  # Official Flow-OPD starts a fresh trainable adapter on the base model.
  init: base
  lora_rank: 32
  lora_alpha: 64
teachers:
  - name: ocr
    lora_dir: jieliu/SD3.5M-FlowGRPO-Text
  - name: geneval
    lora_dir: jieliu/SD3.5M-FlowGRPO-GenEval
routing:
  granularity: optimizer_step
  # Official mixed SD3.5-M recipe alternates OCR:GenEval at 1:3.
  routes:
    - {teacher: ocr, dataset: ocr, weight: 1.0}
    - {teacher: geneval, dataset: geneval, weight: 3.0}
data:
  prompts_csv: data/public_small/prompts.txt
  prompt_column: prompt
  task_column: task
training:
  method: flowopd
  output_dir: outputs/sd35_flowopd_public
  resolution: 512
  rollout_steps: 10
  lr: 1.0e-4
  grad_accum: 1
  max_train_steps: 1
  save_steps: 1
  mixed_precision: bf16
  teacher_cfg_scale: 1.0
  student_cfg_scale: 1.0
  flowopd_noise_level: 0.7
  flowopd_group_size: 16
  flowopd_k_states: 10
  flowopd_query_bias: uniform
  flowopd_clip_range: 1.0e-4
  flowopd_kl_scale: -1.0
  flowopd_anchor_beta: 0.0
  log_every: 1
